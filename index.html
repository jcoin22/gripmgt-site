<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grip Management LLC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />

  <!-- Facebook Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '3967326260201283');

  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=3967326260201283&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Facebook Pixel Code -->
</head>
<body>
  <main class="container">
    <h1>Grip Management LLC</h1>
    <p><strong>High-Performance Driving · Trackside Support · Local Auto Services</strong></p>

    <section>
      <h2>Contact</h2>
      <ul>
        <li>📞 <a href="tel:+19414048452">(941) 404-8452</a></li>
        <li>✉️ <a href="mailto:john@gripmgmt.com">john@gripmgmt.com</a></li>
        <li>🌐 <a href="https://www.gripmgmt.com">www.gripmgmt.com</a></li>
        <li>📍 Bradenton, FL · Serving Sarasota & Trackside Events</li>
      </ul>
    </section>

    <section>
      <h2>Contact Us</h2>
      <form id="contact-form">
        <div class="grid">
          <label for="name">
            Name <span style="color:red">*</span>
            <input type="text" id="name" name="name" required>
          </label>

          <label for="email">
            Email <span style="color:red">*</span>
            <input type="email" id="email" name="_replyto" required>
          </label>
        </div>

        <label for="phone">
          Phone Number
          <input type="tel" id="phone" name="phone" placeholder="Optional">
        </label>

        <label for="message">
          Message <span style="color:red">*</span>
          <textarea id="message" name="message" rows="5" required></textarea>
        </label>

        <button type="submit">Send Message</button>

        <p id="success-message" style="display:none; color:green; margin-top:1rem;">
          ✅ Thank you! Your message has been sent.
        </p>
      </form>

      <script>
        document.getElementById('contact-form').addEventListener('submit', async function (e) {
          e.preventDefault();

          const form = e.target;
          const data = new FormData(form);

          const response = await fetch("https://formspree.io/f/mrbqpzyj", {
            method: "POST",
            body: data,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            form.reset();
            document.getElementById('success-message').style.display = 'block';
          } else {
            alert("Oops! There was a problem submitting your form.");
          }
        });
      </script>
    </section>
  </main>
</body>
</html>
